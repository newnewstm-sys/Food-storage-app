<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Storage Lookup</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00c805">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #000000;
    --card: #1a1a1a;
    --text: #ffffff;
    --muted: #8e8e93;
    --accent: #00c805;
    --accent-hover: #00b304;
    --border: #2c2c2e;
    --input-bg: #262626;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px 24px;
    width: 100%;
    max-width: 380px;
  }
  h1 {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 8px;
    color: var(--muted);
  }
  input, select {
    width: 100%;
    padding: 14px 14px;
    font-size: 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    margin-bottom: 18px;
    -webkit-appearance: none;
    appearance: none;
  }
  input::placeholder { color: #5c5c5e; }
  select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 18px;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  #go {
    display: block;
    width: 100%;
    padding: 15px;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #000000;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    box-sizing: border-box;
  }
  #go:hover { background: var(--accent-hover); }
</style>
</style>
</head>
<body>
  <div class="card">
    <h1>Food Storage Lookup</h1>
    <p class="sub">Enter a food and where it's stored — get a Google search for how long it lasts once opened.</p>

    <label for="food">Food</label>
    <input id="food" type="text" placeholder="e.g. chicken sausage" autocomplete="off">

    <label for="storage">Storage</label>
    <select id="storage">
      <option value="fridge">Fridge</option>
      <option value="out">Out (room temp)</option>
      <option value="freezer">Freezer</option>
    </select>

    <a id="go" href="#" target="_blank" rel="noopener noreferrer">Search</a>
  </div>

  <script>
    const storageText = {
      fridge: "in fridge",
      out: "out at room temp",
      freezer: "in freezer"
    };

    function buildUrl() {
      const food = document.getElementById('food').value.trim();
      const storage = document.getElementById('storage').value;
      if (!food) return null;
      const query = `how long does opened ${food} last ${storageText[storage]}`;
      return `https://www.google.com/search?q=${encodeURIComponent(query)}`;
    }

    const link = document.getElementById('go');

    link.addEventListener('click', (e) => {
      const url = buildUrl();
      if (!url) {
        e.preventDefault();
        document.getElementById('food').focus();
        return;
      }
      link.href = url;
    });

    document.getElementById('food').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const url = buildUrl();
        if (url) {
          link.href = url;
          link.click();
        } else {
          document.getElementById('food').focus();
        }
      }
    });
  </script>
</body>
</html>
